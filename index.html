<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cojoin</title>
<meta name="description" content="Cojoin helps you actually see the people who matter most.">
<style>
  :root { --ink:#100E14; --ground:#FBF8F2; --mint:#9FE8B4; --ink70:rgba(16,14,20,.72); }
  html,body { margin:0; background:var(--ground); color:var(--ink); font-family: -apple-system, "Space Grotesk", Helvetica, Arial, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-size:56px; line-height:.95; letter-spacing:-.03em; text-transform:uppercase; margin:0 0 14px; }
  p { font-size:16px; line-height:1.5; color:var(--ink70); }
  .rule { height:3px; background:var(--ink); margin:22px 0; }
  a.btn { display:inline-block; background:var(--ink); color:var(--ground); text-decoration:none; padding:14px 18px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:12px; margin-top:8px; }
  a { color:var(--ink); }
  ul { padding-left:18px; color:var(--ink70); line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>Cojoin</h1>
  <p>Keep seeing the people who matter. Log hangouts, keep streaks, cast a vibe, and find out who's around tonight.</p>
  <div class="rule"></div>
  <ul>
    <li><a href="/privacy">Privacy policy</a></li>
    <li>Support: <a href="mailto:support@cojoin.app">support@cojoin.app</a></li>
    <li>Got an invite link? Open it on your phone; it takes you into the app.</li>
  </ul>
  <a class="btn" href="https://apps.apple.com/">Get the app</a>
</main>
</body>
</html>
